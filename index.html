<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-theme="light">

  <header>
    <h1>Expense &amp; Budget Visualizer</h1>
    <button id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode"></button>
  </header>

  <div id="category-dialog-backdrop" class="dialog-backdrop" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <div class="dialog-header">
        <h2 id="dialog-title">Add Category</h2>
        <button id="dialog-close-btn" class="btn-icon" aria-label="Close">&times;</button>
      </div>
      <div class="dialog-body">
        <div class="field-group">
          <label for="new-category">Category Name</label>
          <input id="new-category" type="text" maxlength="50"
                 placeholder="e.g. Health, Shopping…" autocomplete="off" />
          <span class="field-error" id="error-category-name" role="alert"></span>
        </div>
      </div>
      <div class="dialog-footer">
        <button id="dialog-cancel-btn" class="btn-secondary">Cancel</button>
        <button id="add-category-btn">Add Category</button>
      </div>
    </div>
  </div>

  <div class="app-layout">
    <section id="balance-section" class="card">
      <p class="card-title">💳 Total Balance</p>
      <p id="balance-display">Rp0</p>
      <p class="balance-subtitle">All recorded expenses</p>
    </section>

    <div class="row-two-col">
      <section id="form-section" class="card card-accent-indigo">
        <p class="card-title">✏️ Add Transaction</p>
        <form id="transaction-form" novalidate>
          <div class="field-group">
            <label for="item-name">Item Name</label>
            <input id="item-name" type="text" maxlength="100" autocomplete="off"
                   placeholder="e.g. Coffee, Rent…" required />
            <span class="field-error" id="error-name" role="alert"></span>
          </div>
          <div class="field-group">
            <label for="amount">Amount (Rp)</label>
            <input id="amount" type="number" min="1000" max="999999999.99"
                   step="1000" placeholder="0" required />
            <span class="field-error" id="error-amount" role="alert"></span>
          </div>
          <div class="field-group">
            <label for="category">Category</label>
            <select id="category" required></select>
            <span class="field-error" id="error-category" role="alert"></span>
          </div>
          <button type="submit">+ Add Transaction</button>
        </form>
      </section>

      <section id="list-section" class="card card-accent-green">
        <p class="card-title">📋 Transactions</p>
        <div id="transaction-list" role="list">
          <p id="list-empty"></p>
        </div>
      </section>
    </div>

    <section id="spending-limits-section" class="card card-accent-amber">
      <p class="card-title">🎯 Spending Limits</p>
      <div id="limits-list"></div>
    </section>

    <div class="row-two-col">
      <section id="chart-section" class="card card-accent-indigo">
        <p class="card-title">📊 Spending Distribution</p>
        <div id="chart-container">
          <canvas id="spending-chart"></canvas>
          <p id="chart-empty" hidden></p>
        </div>
      </section>

      <section id="summary-section" class="card card-accent-purple">
        <p class="card-title">📅 Monthly Summary</p>
        <div id="summary-content"></div>
      </section>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
